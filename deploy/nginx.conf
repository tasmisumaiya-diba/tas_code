worker_processes auto;
pid /tmp/nginx.pid;
user nginx;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    limit_req_zone $binary_remote_addr zone=convert_api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=analyze_api:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @rate_limited;

    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 443 ssl http2;
        server_name _;
        set $codebridge_upstream codebridge:8080;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:CodeBridgeTLS:10m;
        ssl_session_timeout 10m;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        location = /api/convert {
            limit_req zone=convert_api burst=10 nodelay;
            proxy_pass http://$codebridge_upstream;
        }

        location = /api/analyze {
            limit_req zone=analyze_api burst=4 nodelay;
            proxy_pass http://$codebridge_upstream;
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Request rate limit exceeded. Please try again shortly."}';
        }

        location / {
            proxy_pass http://$codebridge_upstream;
        }
    }
}
